<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Concurso</title>

<body>


    <div class="container-fluid p-5 bg-primary text-white text-center">
        <h1>CONCURSO BUSCANDO NOVIA A MIGUEL</h1>
        <h2>La ganadora viaja a Florianópolis</h2>
        <h5>con todos los gastos pagados</h5>

    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="col-sm-4">
                <h3 class="text-center">CLARA</h3>
                <img class="img-fluid w-100" src="img/clara1.jpg" alt="">
            </div>
            <div class="col-sm-4">
                <h3 class="text-center">ROCIO</h3>
                <img class="img-fluid w-100" src="img/rocio1.jpg" alt="">
            </div>
            <div class="col-sm-4">
                <h3 class="text-center">ROSIMAR</h3>
                <img class="img-fluid w-100" src="img/rosimar1.jpg" alt="">
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="col-sm-12">
                <h1 class="text-center">O debería viajar con las tres chicas</h1>

            <div class="col-sm-12">
                <img class="img-fluid d-block mx-auto w-50" src="img/miguel3.jpg" alt="">
            </div>
        </div>
    </div>

    <div class="container mt-5">

            <div class="col-sm-12">
                <div class="d-flex justify-content-center">
                    <div class="btn-group">
                        <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">

                        </button>
                        <div class="dropdown-menu">
                            <a id="btn-clara" class="dropdown-item" href="#">CLARA</a>
                            <a id="btn-rocio" class="dropdown-item" href="#">ROCIO</a>
                            <a id="btn-rosimar" class="dropdown-item" href="#">ROSIMAR</a>
                            <a id="btn-tres" class="dropdown-item" href="#">QUE VIAJEN LAS 3</a>

                    </div>
                </div>
            </div>

    </div>

    <div class="container mt-5 mb-5">
        <div class="text-center">
            Provincia de Córdoba - República Argentina - 2026
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
